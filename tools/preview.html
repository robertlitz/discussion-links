<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discussion Links · review</title><style>body{margin:0;background:#e9ede7;color:#203a34;font:14px/1.7 system-ui}main{max-width:960px;margin:45px auto;display:flex;gap:60px;padding:20px;align-items:flex-start}aside{max-width:350px;padding-top:25px}h1{font-size:36px;line-height:1.2;letter-spacing:-1px}small{letter-spacing:2px}p{color:#65756d}iframe{width:392px;height:730px;border:1px solid #d6dfd3;border-radius:15px;background:#f8f9f5;box-shadow:0 15px 60px #203a3415}a{display:inline-block;color:#24665a;margin:5px 8px 5px 0}button,select{padding:8px;color:#203a34;border:1px solid #bdcabc;background:#f8f9f5;border-radius:6px}label{display:block;margin:25px 0 8px}@media(max-width:800px){main{flex-direction:column;gap:20px;margin:10px}iframe{max-width:100%}}</style><main><aside><small>CHROME EXTENSION</small><h1>Find the conversation behind the page.</h1><p>A small, quiet home for Reddit and Hacker News submissions that link to what you’re reading.</p><p><strong>UI test preview</strong> · fixtures only. This view exercises the production popup files; it does not install a browser extension.</p><label for="scenario">Review a state</label><select id="scenario"><option value="populated">Discussions found</option><option value="empty">No matches</option><option value="partial">Reddit unavailable</option><option value="loading">Still searching</option><option value="private">Private / unsupported page</option><option value="long">Long titles &amp; unsafe text</option><option value="many">200 discussions</option></select><p><a href="/benchmark.html">Run loading benchmark ↗</a></p></aside><iframe id="popup" src="/popup.html?scenario=populated" title="Discussion Links popup"></iframe></main><script>document.getElementById('scenario').addEventListener('change',e=>document.getElementById('popup').src='/popup.html?scenario='+e.target.value);</script></html>
